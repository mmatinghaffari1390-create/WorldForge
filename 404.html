<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111713">
  <meta name="robots" content="noindex">
  <title>404 — WORLDFORGE</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#0b100d;--panel:#141c16;--line:#2b3b2d;--lime:#a5f16b;--text:#f2f6ef;--muted:#a8b6a5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#263b25 0%,transparent 55%),var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}
    main{width:min(100%,680px);padding:clamp(28px,6vw,58px);text-align:center;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#18221aee,#101611f5);box-shadow:0 24px 90px #0007}
    .mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 22px;border:1px solid #d5ffb3;border-radius:14px;background:var(--lime);color:#142016;font-weight:1000;font-size:25px;box-shadow:0 0 34px #a5f16b28}
    .eyebrow{font:700 12px/1.5 monospace;letter-spacing:.22em;color:var(--lime);direction:ltr}
    h1{margin:12px 0 8px;font-size:clamp(64px,13vw,108px);line-height:1;letter-spacing:-.06em;color:var(--lime)}
    h2{margin:16px 0 12px;font-size:clamp(22px,4vw,32px)}
    p{max-width:440px;margin:0 auto;color:var(--muted);line-height:1.9}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border:1px solid var(--line);border-radius:12px;color:var(--text);text-decoration:none;font-weight:700;transition:transform .18s,border-color .18s}
    a.primary{background:var(--lime);border-color:var(--lime);color:#142016}
    a:hover{transform:translateY(-2px);border-color:var(--lime)}
    footer{margin-top:34px;color:#6f806e;font:11px/1.8 monospace;direction:ltr}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">W</div>
    <div class="eyebrow">WORLDFORGE // LOST CHUNK</div>
    <h1>404</h1>
    <h2>این صفحه در این دنیا پیدا نشد!</h2>
    <p>احتمالاً آدرس اشتباه است یا این بخش هنوز ساخته نشده. برگرد به دنیای اصلی و ماجراجویی را ادامه بده.</p>
    <div class="actions">
      <a class="primary" href="./index.html">برگشت به صفحه اصلی <span aria-hidden="true">&nbsp; ←</span></a>
      <a href="https://github.com/mmatinghaffari1390-create/WorldForge">مخزن پروژه</a>
    </div>
    <footer>CRAFT YOUR WORLD · BUILD SOMETHING LEGENDARY</footer>
  </main>
</body>
</html>
